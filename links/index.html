<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/webp"
      href="/assets/styllus-mark-header.webp"
    />
    <meta name="theme-color" content="#08111b" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Fale com a Styllus no WhatsApp, agende sua aula experimental e veja como chegar à academia em Palhoça." />
    <title>Links | Styllus Fitness Center</title>
    <link rel="stylesheet" href="/src/links.css" />
  </head>
  <body class="links-page">
    <main class="links-container">
      <header class="links-header">
        <img
          class="links-brand"
          src="/assets/styllus-lockup.webp"
          width="240"
          height="240"
          alt="Styllus Fitness Center"
        />
        <p class="links-kicker">Desde 2005 em Palhoça</p>
        <h1>Vamos treinar?</h1>
      </header>
      <p class="links-hours">
        <span>Seg–sex</span> 06h–23h <i></i> <span>Sábado</span> 09h–12h
      </p>
      <nav class="links-nav" aria-label="Atalhos Styllus">
        <a
          data-whatsapp
          data-whatsapp-message="trial"
          class="button button-primary links-button"
          href="https://api.whatsapp.com/send?phone=5548991885129&amp;text=Ol%C3%A1!%20Gostaria%20de%20agendar%20uma%20aula%20experimental%20na%20Styllus%20Fitness%20Center."
          target="_blank"
          rel="noopener noreferrer"
        >Agendar aula experimental <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12" /></svg></a
        ><a
          data-whatsapp
          data-whatsapp-message="plans"
          class="button button-ghost links-button"
          href="https://api.whatsapp.com/send?phone=5548991885129&amp;text=Ol%C3%A1!%20Gostaria%20de%20conhecer%20os%20planos%20e%20as%20condi%C3%A7%C3%B5es%20atuais%20da%20Styllus%20Fitness%20Center."
          target="_blank"
          rel="noopener noreferrer"
        >Consultar planos no WhatsApp <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12" /></svg></a
        ><button
          type="button"
          class="button button-ghost links-button"
          id="map-toggle"
          aria-expanded="false"
          aria-controls="map-container"
        >
          Como chegar <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <div class="links-map-container" id="map-container" hidden>
          <iframe
            data-map-src="https://www.google.com/maps?q=R.+Princesa+Isabel%2C+600%2C+Pte.+do+Imaruim%2C+Palho%C3%A7a+-+SC%2C+88130-635&amp;output=embed"
            title="Mapa da Styllus Fitness Center"
            loading="lazy"
            tabindex="-1"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </nav>
      <a class="text-link links-site" href="../">Conhecer o site <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12" /></svg></a>
    </main>
    <script type="module" src="/src/links.js"></script>
  </body>
</html>
